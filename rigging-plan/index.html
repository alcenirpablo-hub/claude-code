function solve3(M,b){
  const A=M.map((r,i)=>[...r,b[i]]);
  for(let i=0;i<3;i++){let p=i;for(let r=i+1;r<3;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];
    const d=A[i][i]||1e-12;for(let r=i+1;r<3;r++){const f=A[r][i]/d;for(let c=i;c<4;c++)A[r][c]-=f*A[i][c]}}
  const x=[0,0,0];for(let i=2;i>=0;i--){let s=A[i][3];for(let c=i+1;c<3;c++)s-=A[i][c]*x[c];x[i]=s/(A[i][i]||1e-12)}return x;

function slingCandidates(R){

  if(R.kind==='web')WEB.forEach(([w,b,m])=>list.push({id:'t'+w,name:'Cinta têxtil '+w+' t / '+b+' mm',wll:w,massM:m*1000/1000*1,src:'EN 1492-1 (código de cor)'}));
  if(R.kind==='chain')CHAIN.forEach(([d,w])=>list.push({id:'c'+d,name:'Corrente classe '+R.chainG+' Ø'+d+' mm',wll:w*(R.chainG===100?1.25:1),massM:0.022*d*d,src:'EN 818-2/4'}));
  S.db.acc.filter(a=>a.kind==='sling-'+R.kind).forEach(a=>list.push({id:'u'+a.id,name:a.name,wll:a.wll,massM:a.massM||0,src:'Usuário'}));
  list.forEach(s=>s.wllE=s.wll*R.mode);
  return list.sort((a,b)=>a.wllE-b.wllE);
}
function shackleList(){return SHACKLES.concat(S.db.acc.filter(a=>a.kind==='shackle').map(a=>({id:'u'+a.id,name:a.name,wll:a.wll,mass:a.massM||0,src:'Usuário'}))).sort((a,b)=>a.wll-b.wll)}
function capAt(chart,r){
  const s=[...chart].sort((a,b)=>a[0]-b[0]);if(!s.length)return{cap:null,out:true};
  if(r>s[s.length-1][0]+1e-9)return{cap:null,out:true};
  const row=s.find(x=>x[0]>=r-1e-9);return{cap:row[1],R:row[0],out:false};
}
function calc(){
  const L=S.load,R=S.rig,E=S.equip,C={checks:[]};
  const add=(id,tab,label,status,value,detail)=>C.checks.push({id,tab,label,status,value:value??'',detail:detail??''});
  const crane=allCranes().find(c=>c.id===E.craneId)||null;C.crane=crane;
  const lugs=(L.lugs||[]).map(l=>({x:+l.x||0,z:+l.z||0,y:+l.y||0}));const n=lugs.length;C.n=n;
  const topY=n?Math.max(...lugs.map(l=>l.y)):(+L.H||0);
  const hookY=topY+(+R.hookH||0);C.hookY=hookY;
  C.legs=lugs.map(l=>{const dx=l.x-L.cx,dz=l.z-L.cz,d=Math.hypot(dx,dz),v=Math.max(hookY-l.y,0.01);return{...l,d,v,len:Math.hypot(d,v),beta:deg(Math.atan2(d,v))}});
  const tol=1+(+L.tol||0)/100;
  const fixed=((+R.master.mass||0)+(R.spreader.use?+R.spreader.mass||0:0)+(+R.extra||0))/1000;
  const cands=slingCandidates(R),shl=shackleList();
  let sl=null,sh=null,rigT=fixed,T=[],shares=[],Wd=0,Tmax=0;
  for(let it=0;it<4;it++){
    Wd=(L.mass*tol+rigT)*R.daf;
    shares=distribute(C.legs,L.cx,L.cz,Wd,R.dist);
    T=shares.map((r,i)=>Math.abs(r)/Math.max(Math.cos(rad(C.legs[i].beta)),0.05));
    Tmax=T.length?Math.max(...T):0;
    sl=R.slingId!=='auto'?(cands.find(s=>s.id===R.slingId)||null):null;
    if(!sl)sl=cands.find(s=>s.wllE>=Tmax)||cands[cands.length-1]||null;
    sh=R.shackleId!=='auto'?(shl.find(s=>s.id===R.shackleId)||null):null;
    if(!sh)sh=shl.find(s=>s.wll>=Tmax)||shl[shl.length-1]||null;
    rigT=fixed+(sl?C.legs.reduce((s,l)=>s+sl.massM*(l.len+0.6),0)/1000:0)+(sh?sh.mass*n/1000:0);
  }
  Object.assign(C,{Wd,T,shares,Tmax,sl,sh,rigT,cands,shl,fixed,tol});
  C.maxBeta=C.legs.length?Math.max(...C.legs.map(l=>l.beta)):0;
  C.minShare=shares.length?Math.min(...shares):0;
  // --- eslingas e acessórios
  if(!n)add('lugs','carga','Pontos de içamento','bad','nenhum','Cadastre ao menos um olhal na aba Carga.');
  else if(n===1)add('lugs','carga','Pontos de içamento','warn','1 olhal','Içamento por um ponto: confirme estabilidade e rotação da carga.');
  else add('lugs','carga','Pontos de içamento','ok',n+' olhais','');
  if(n){
    const gap=Math.hypot(L.cx-(lugs.reduce((s,l)=>s+l.x,0)/n),L.cz-(lugs.reduce((s,l)=>s+l.z,0)/n));
    if(C.minShare<-1e-6)add('cg','carga','Centro de gravidade × olhais','bad','perna sem carga','O CG está fora da região dos olhais: um olhal fica sem carga ou em compressão.');
    else add('cg','carga','Centro de gravidade × olhais','ok','CG a '+nf(gap,2)+' m do centroide dos olhais','Distribuição por equilíbrio de corpo rígido.');
    const st=C.maxBeta>60?'bad':C.maxBeta>45?'warn':'ok';
    add('beta','rigging','Ângulo das pernas (a partir da vertical)',st,nf(C.maxBeta,1)+'°',st==='bad'?'Acima de 60°: aumente a altura do gancho ou use balancim.':st==='warn'?'Entre 45° e 60°: esforço nas pernas já elevado.':'Dentro do recomendado (≤ 45°).');
  }
  if(sl){const u=Tmax/sl.wllE;add('sling','rigging','Eslinga: '+sl.name,u>1?'bad':u>0.95?'warn':'ok',nf(u*100,0)+'% de '+nf(sl.wllE,2)+' t','Esforço máximo por perna '+nf(Tmax,2)+' t (carga de projeto com FD '+nf(R.daf,2)+'). Fator de modo '+R.mode+'.')}
  else add('sling','rigging','Eslinga','bad','sem opção','Nenhuma eslinga na lista.');
  if(sh){const u=Tmax/sh.wll;add('shackle','rigging','Manilha: '+sh.name,u>1?'bad':u>0.95?'warn':'ok',nf(u*100,0)+'% de '+nf(sh.wll,2)+' t','Conferir diâmetro do pino × furo do olhal e carga lateral.')}
  if(R.master.wll>0){const u=Wd/R.master.wll;add('master','rigging','Elo mestre / gancho: '+(R.master.name||'informado'),u>1?'bad':u>0.95?'warn':'ok',nf(u*100,0)+'% de '+nf(R.master.wll,2)+' t','Carga de projeto total '+nf(Wd,2)+' t.')}
  else add('master','rigging','Elo mestre / gancho','warn','não informado','Informe o WLL do elo mestre na aba Rigging.');
  if(R.spreader.use){if(R.spreader.wll>0){const u=Wd/R.spreader.wll;add('spread','rigging','Balancim: '+(R.spreader.name||'informado'),u>1?'bad':u>0.95?'warn':'ok',nf(u*100,0)+'% de '+nf(R.spreader.wll,2)+' t','')}else add('spread','rigging','Balancim','warn','sem WLL','Informe o WLL do balancim.')}
  // --- guindaste
  C.hookLoad=0;C.cap=null;C.util=null;C.limit=E.limit;
  if(!crane){add('crane','equip','Equipamento de içamento','bad','nenhum','Selecione um equipamento.')}
  else if(crane.type==='mobile'){
    const boom=crane.booms[clamp(E.boom,0,crane.booms.length-1)];C.boom=boom;
    const hookLoad=L.mass*tol+rigT+crane.hookBlock.mass;C.hookLoad=hookLoad;
    const geo=r=>{const x=r-crane.a,ok=x>0&&x<=boom.L;const th=ok?Math.acos(x/boom.L):NaN;return{r,th:deg(th),tip:ok?crane.hp+boom.L*Math.sin(th):NaN,ok}};

    const cp=capAt(boom.chart,+E.radPick),cs=capAt(boom.chart,+E.radSet);C.capPick=cp;C.capSet=cs;
    const worst=[cp,cs];
    if(worst.some(w=>w.out)){add('crane','equip','Capacidade na tabela de carga','bad','raio fora da tabela','O raio está além do último raio tabelado da lança selecionada.')}
    else{
      const cap=Math.min(cp.cap,cs.cap);C.cap=cap;C.util=hookLoad/cap*100;
      const st=C.util>100?'bad':C.util>E.limit?'warn':'ok';
      add('crane','equip','Capacidade do guindaste ('+nf(boom.L,0)+' m de lança)',st,nf(C.util,0)+'% de '+nf(cap,1)+' t','Carga no gancho '+nf(hookLoad,2)+' t (carga + tolerância + rigging + moitão). Limite adotado '+nf(E.limit,0)+'%. Raio arredondado para cima na tabela.'+(st==='warn'?' Acima do limite adotado: tratar como içamento crítico.':''));
    }
    for(const [g,nm] of [[C.gPick,'retirada'],[C.gSet,'posicionamento']]){
      if(!g.ok)add('angle-'+nm,'equip','Ângulo da lança ('+nm+')','bad','alcance','Raio '+nf(g.r,1)+' m inalcançável com '+nf(boom.L,0)+' m de lança.');
      else if(g.th<crane.minAngle||g.th>crane.maxAngle)add('angle-'+nm,'equip','Ângulo da lança ('+nm+')','bad',nf(g.th,1)+'°','Fora da faixa '+crane.minAngle+'° a '+crane.maxAngle+'°.');
    }

      const need=E.obst+E.margin+hookY+crane.hookBlock.h;const tip=Math.min(C.gPick.tip,C.gSet.tip);C.needTip=need;C.reserve=tip-need;
      add('height','equip','Altura na ponta da lança',C.reserve<0?'bad':C.reserve<1?'warn':'ok','reserva '+nf(C.reserve,1)+' m','Necessário '+nf(need,1)+' m (obstáculo '+nf(E.obst,1)+' + folga '+nf(E.margin,1)+' + gancho '+nf(hookY,1)+' + moitão '+nf(crane.hookBlock.h,1)+'). Disponível '+nf(tip,1)+' m.');
    }
    if(E.reaction>0&&E.pad>0){const p=E.reaction/E.pad;C.press=p;add('ground','equip','Pressão sobre o solo',p>E.soil?'bad':p>0.8*E.soil?'warn':'ok',nf(p,0)+' de '+nf(E.soil,0)+' kPa','Reação do apoio '+nf(E.reaction,0)+' kN sobre '+nf(E.pad,2)+' m². Use a reação máxima fornecida pelo fabricante.')}
    else add('ground','equip','Pressão sobre o solo','na','não calculada','Informe a reação do apoio e a área da sapata (aba Equipamento).');
  } else {
    const cap=E.hoist==='aux'?crane.aux:crane.rated;const hookLoad=L.mass*tol+rigT;C.hookLoad=hookLoad;C.cap=cap;C.util=hookLoad/cap*100;
    const st=C.util>100?'bad':C.util>E.limit?'warn':'ok';
    add('crane','equip','Capacidade da ponte ('+(E.hoist==='aux'?'auxiliar':'principal')+')',st,nf(C.util,0)+'% de '+nf(cap,1)+' t','Carga no gancho '+nf(hookLoad,2)+' t. Limite adotado '+nf(E.limit,0)+'%.');
    const need=E.obst+E.margin+hookY;C.needTip=need;C.reserve=crane.hookMaxH-crane.hookBlock.h-need;
    add('height','equip','Altura do gancho',C.reserve<0?'bad':C.reserve<0.5?'warn':'ok','reserva '+nf(C.reserve,1)+' m','Necessário '+nf(need,1)+' m acima do piso, disponível '+nf(crane.hookMaxH-crane.hookBlock.h,1)+' m (gancho no fim de curso, descontado o moitão).');
  }
  // --- vento
  const F=0.5*1.225*E.wind*E.wind*L.windCd*L.windA/1000;C.windF=F;
  if(E.wind>E.windMax)add('wind','equip','Vento','bad',nf(E.wind,1)+' m/s','Acima do limite de '+nf(E.windMax,1)+' m/s.');
  else add('wind','equip','Vento',E.wind>0.8*E.windMax?'warn':'ok',nf(E.wind,1)+' m/s','Força sobre a carga ≈ '+nf(F,1)+' kN (ρ=1,225; Cd '+L.windCd+'; A '+L.windA+' m²). O limite real vem do manual do equipamento.');
  // --- checklist
  const pend=CHECKLIST.filter(([k])=>!S.chk[k]).length;C.pending=pend;
  add('chk','verif','Checklist operacional',pend===0?'ok':'warn',(CHECKLIST.length-pend)+' de '+CHECKLIST.length,pend?pend+' item(ns) pendente(s).':'Completo.');

}

    o+='<line class="bm" style="stroke-width:3" x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'"/>';
    o+='<text class="st" x="'+X(R/2)+'" y="'+(Y(0)-8)+'" text-anchor="middle">R retirada '+nf(R,1)+' m</text>';
    if(Math.abs(Rs-R)>0.05)o+='<text class="st" x="'+X(Rs)+'" y="'+(Y(0)+(Rs*s>0?Hh/2-m:0)-0)+'" text-anchor="middle" opacity="0">.</text><text class="st" x="'+(X(0)+Rs*s*0.72)+'" y="'+(Y(0)+Rs*s*0.69)+'">R posicionamento '+nf(Rs,1)+' m</text>';
    o+='<rect class="ld" x="'+X(R-L.cx-L.L/2)+'" y="'+Y(-L.cz-L.W/2)+'" width="'+L.L*s+'" height="'+L.W*s+'"/>';
  } else {
    o+='<rect class="cr" x="'+X(x0)+'" y="'+Y(-.25)+'" width="'+c.span*s+'" height="'+.5*s+'"/><text class="m" x="'+X(x0)+'" y="'+(Y(-.25)-6)+'">vão '+nf(c.span,1)+' m</text>';
    o+='<rect class="ld" x="'+X(-L.cx-L.L/2)+'" y="'+Y(-L.cz-L.W/2)+'" width="'+L.L*s+'" height="'+L.W*s+'"/>';
  }
  o+='</svg>';return o;
}
function svgChart(C){
  const c=C.crane;if(!c||c.type!=='mobile'||!C.boom)return'<p class="note">Gráfico disponível para guindastes móveis.</p>';
  const ch=[...C.boom.chart].sort((a,b)=>a[0]-b[0]),W=720,H=320,ml=46,mr=14,mt=14,mb=36;
  const xmax=Math.max(ch[ch.length-1][0],+S.equip.radPick,+S.equip.radSet)*1.05,ymax=Math.max(...ch.map(r=>r[1]),C.hookLoad)*1.1;
  const X=x=>ml+x/xmax*(W-ml-mr),Y=y=>H-mb-y/ymax*(H-mt-mb);
  const tick=(mx,n)=>{const raw=mx/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=(f<1.5?1:f<3?2:f<7?5:10)*p,a=[];for(let v=0;v<=mx;v+=st)a.push(v);return a};
  let o='<svg class="draw" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tabela de carga e ponto de operação">';
  tick(ymax,5).forEach(v=>{o+='<line class="g" stroke-opacity=".25" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="m" x="'+(ml-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+nf(v,0)+'</text>'});
  tick(xmax,8).forEach(v=>{o+='<line class="g" stroke-opacity=".25" y1="'+mt+'" y2="'+(H-mb)+'" x1="'+X(v)+'" x2="'+X(v)+'"/><text class="m" y="'+(H-mb+16)+'" x="'+X(v)+'" text-anchor="middle">'+nf(v,0)+'</text>'});
  o+='<polyline fill="none" stroke="var(--steel)" stroke-width="2.4" points="'+ch.map(r=>X(r[0])+','+Y(r[1])).join(' ')+'"/>';
  ch.forEach(r=>{o+='<circle cx="'+X(r[0])+'" cy="'+Y(r[1])+'" r="2.6" fill="var(--steel)"/>'});
  const col=C.util==null?'var(--na)':C.util>100?'var(--bad)':C.util>S.equip.limit?'var(--warn)':'var(--ok)';
  (Math.abs(S.equip.radPick-S.equip.radSet)<1e-6?[[+S.equip.radPick,'retirada = posicionamento']]:[[+S.equip.radPick,'retirada'],[+S.equip.radSet,'posic.']]).forEach(([r,n],i)=>{o+='<line x1="'+X(r)+'" x2="'+X(r)+'" y1="'+Y(0)+'" y2="'+Y(C.hookLoad)+'" stroke="'+col+'" stroke-dasharray="3 3"/><circle cx="'+X(r)+'" cy="'+Y(C.hookLoad)+'" r="6" fill="'+col+'" stroke="var(--panel)" stroke-width="2"/><text x="'+(X(r)+9)+'" y="'+(Y(C.hookLoad)-8-i*12)+'">'+n+'</text>'});
  o+='<text class="m" x="'+(W/2)+'" y="'+(H-4)+'" text-anchor="middle">raio (m)</text><text class="m" x="12" y="'+(mt+8)+'">t</text></svg>';
  return o;
}

/* ============================== renderização e eventos ============================== */
const NAV=[['grp','Plano'],['projeto','Projeto',1],['carga','Carga',2],['modelo','Desenho e modelo',3],['equip','Equipamento',4],['rigging','Rigging',5],['verif','Verificações',6],['viz','Visualização',7],['rel','Relatório',8],['grp','Referência'],['db','Banco de dados'],['cat','Catálogos']];
function tabStatus(t,C){
  const own=C.checks.filter(c=>c.tab===t);if(!own.length)return t==='rel'||t==='verif'?C.verdict:'na';
  const s=own.map(c=>c.status);return s.includes('bad')?'bad':s.includes('warn')?'warn':'ok';
}
function renderNav(){
  $('#nav').innerHTML=NAV.map(n=>n[0]==='grp'?'<div class="grp">'+n[1]+'</div>':'<button data-tab="'+n[0]+'"'+(n[0]===tab?' aria-current="page"':'')+'><span class="n">'+(n[2]||'')+'</span><span>'+n[1]+'</span><span class="dot '+tabStatus(n[0],C)+'" title="'+STL[tabStatus(n[0],C)]+'"></span></button>').join('');
}
LIVE.verdict=C=>chip(C.verdict,C.verdict==='bad'?'NÃO CONFORME · '+C.checks.filter(c=>c.status==='bad').length+' item(ns)':C.verdict==='warn'?'ATENÇÃO · '+C.checks.filter(c=>c.status==='warn').length+' item(ns)':'CÁLCULOS SEM NÃO CONFORMIDADE');
function refreshLive(){
  C=calc();
  $$('[data-live]').forEach(el=>{const f=LIVE[el.dataset.live];if(f)el.innerHTML=f(C)});
  renderNav();
  if(tab==='viz')buildStage();
}
function render(){
  if(stage&&tab!=='viz'){stage.dispose();stage=null}
  if(modelStage&&tab!=='modelo'){modelStage.dispose();modelStage=null}
  $('#view').innerHTML=VIEWS[tab]();
  if(MOUNT[tab])MOUNT[tab]();
  refreshLive();
  if(tab==='viz')buildStage();
}
function go(t){tab=t;try{history.replaceState(null,'','#'+t)}catch(e){}render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});

document.addEventListener('input',onInput);document.addEventListener('change',onInput);
function onInput(e){
  const el=e.target;
  if(el.dataset&&el.dataset.chk){S.chk[el.dataset.chk]=el.checked;save();refreshLive();return}
  if(!el.dataset||!el.dataset.b)return;
  if(e.type==='input'&&el.tagName==='SELECT')return;
  let v=el.value;
  if(el.dataset.bool)v=v==='true';
  else if(el.type==='number'||el.dataset.num){const n=parseFloat(String(v).replace(',','.'));v=Number.isFinite(n)?n:0}
  setp(S,el.dataset.b,v);save();
  if(/^ui\.(up|munit|mat|fill)$/.test(el.dataset.b)&&MODEL&&e.type==='change'){processModel()}
  if(el.dataset.rr&&e.type==='change'){render();return}
  refreshLive();
}
const ACT={
  addLug(){S.load.lugs.push({x:0,z:0,y:S.load.H});save();render()},
  delLug(i){S.load.lugs.splice(+i,1);save();render()},
  genLugs(){const g=S.load.gen,L=S.load,n=+g.n,xs=[-g.dx/2,g.dx/2],zs=n===2?[0]:[-g.dz/2,g.dz/2];
    L.lugs=[];zs.forEach(z=>xs.forEach(x=>L.lugs.push({x:+(x+L.cx).toFixed(3),z:+(z+L.cz).toFixed(3),y:+g.y})));save();render()},
  pickSling(id){S.rig.slingId=id;save();refreshLive()},
  pickShackle(id){S.rig.shackleId=id;save();refreshLive()},
  exportJSON(){$('#json-box').value=JSON.stringify(S,null,1)},
  copyJSON(){const t=JSON.stringify(S,null,1);$('#json-box').value=t;copyText(t)},
  importJSON(){try{const o=JSON.parse($('#json-box').value);S=merge(defaults(),o);save();render();toast('Projeto carregado.')}catch(e){toast('Texto inválido: '+e.message)}},
  example(){const keep=S.db;S=defaults();S.db=keep;save();render()},
  newProj(){const b=$('#np-confirm');b.innerHTML='<button class="btn" data-act="newProj2">Confirmar: apagar tudo e começar em branco</button>'},
  newProj2(){const d=defaults();Object.assign(d.meta,{project:'',tag:'',client:'',site:''});Object.assign(d.load,{name:'',mass:0,lugs:[]});S=d;save();render()},
  copyReport(){copyText(reportText(C),'rep-msg')},
  view(n){if(stage)stage.setView(n,C)},

function d2bounds(){
  let a=[1e18,1e18,-1e18,-1e18];
  if(D2.raster){a=[0,0,D2.raster.width,D2.raster.height]}
  else for(const p of D2.polys)for(const q of p.pts){if(q[0]<a[0])a[0]=q[0];if(q[1]<a[1])a[1]=q[1];if(q[0]>a[2])a[2]=q[0];if(q[1]>a[3])a[3]=q[1]}
  D2.bounds=a;
}
const w2s=(x,y)=>[D2.view.x+D2.view.k*x,D2.view.y+(D2.flip?-D2.view.k*y:D2.view.k*y)];
const s2w=(sx,sy)=>[(sx-D2.view.x)/D2.view.k,D2.flip?-(sy-D2.view.y)/D2.view.k:(sy-D2.view.y)/D2.view.k];
function d2fit(){
  const cvs=$c();if(!cvs||!D2.bounds)return;const r=cvs.getBoundingClientRect(),bb=D2.bounds,w=bb[2]-bb[0]||1,h=bb[3]-bb[1]||1,k=Math.min((r.width-30)/w,(r.height-30)/h),cx=(bb[0]+bb[2])/2,cy=(bb[1]+bb[3])/2;
  D2.view.k=k;D2.view.x=r.width/2-k*cx;D2.view.y=D2.flip?r.height/2+k*cy:r.height/2-k*cy;d2draw();
}
function d2draw(){
  const cvs=$c();if(!cvs||!D2.kind)return;const r=cvs.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  if(cvs.width!==Math.round(r.width*dpr)||cvs.height!==Math.round(r.height*dpr)){cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr)}
  const g=cvs.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);
  if(D2.raster){const [x0,y0]=w2s(0,0);g.drawImage(D2.raster,x0,y0,D2.raster.width*D2.view.k,D2.raster.height*D2.view.k)}
  else{
    g.strokeStyle=cv('--ink');g.lineWidth=1;g.beginPath();
    for(const p of D2.polys){if(D2.hidden[p.layer])continue;let first=true;for(const q of p.pts){const [sx,sy]=w2s(q[0],q[1]);if(first){g.moveTo(sx,sy);first=false}else g.lineTo(sx,sy)}}
    g.stroke();g.fillStyle=cv('--muted');
    let n=0;for(const t of D2.texts){if(D2.hidden[t.layer])continue;const px=t.h*D2.view.k;if(px<5||n>1500)continue;const [sx,sy]=w2s(t.x,t.y);if(sx<-50||sy<-50||sx>r.width+50||sy>r.height+50)continue;g.font=Math.min(px,40)+'px '+cv('--mono');g.fillText(t.t,sx,sy);n++}
  }
  const col=cv('--accent');g.strokeStyle=col;g.fillStyle=col;g.lineWidth=2;g.font='12px '+cv('--mono');
  const pts=D2.tool==='calibrate'?(D2.calPts||D2.pts):D2.pts;
  const seg=(a,b,label)=>{const A=w2s(...a),B=w2s(...b);g.beginPath();g.moveTo(...A);g.lineTo(...B);g.stroke();[A,B].forEach(p=>{g.beginPath();g.arc(p[0],p[1],4,0,7);g.fill()});if(label){g.fillStyle=cv('--panel');const tw=g.measureText(label).width;g.fillRect((A[0]+B[0])/2-2,(A[1]+B[1])/2-14,tw+8,18);g.fillStyle=col;g.fillText(label,(A[0]+B[0])/2+2,(A[1]+B[1])/2)}};
  D2.meas.forEach(m=>seg(m.a,m.b,m.m!=null?nf(m.m,3)+' m':nf(m.d,1)+' px'));
  if(pts.length===1&&D2.cur)seg(pts[0],D2.cur);else if(pts.length===2)seg(pts[0],pts[1]);
  if(D2.snapHit){const p=w2s(...D2.snapHit);g.strokeStyle=cv('--steel');g.strokeRect(p[0]-5,p[1]-5,10,10)}
}
function d2info(){
  const i=$('#d2-info');if(!i)return;
  i.textContent=D2.kind==='dxf'?D2.name+' · '+D2.polys.length.toLocaleString('pt-BR')+' entidades · 1 unidade = '+nf(D2.mPerUnit*1000,D2.mPerUnit<.001?4:1)+' mm':D2.name+' · '+(D2.mPerUnit?'escala calibrada: 1 px = '+nf(D2.mPerUnit*1000,3)+' mm':'calibre a escala antes de medir');
}
function setTool(t){D2.tool=t;D2.pts=[];D2.calPts=null;$('#cal-form').hidden=true;['pan','measure','calibrate'].forEach(n=>{const b=$('#t-'+n);if(b)b.setAttribute('aria-pressed',String(n===t))});
  $c().style.cursor=t==='pan'?'grab':'crosshair';d2draw()}
function drawMeasList(){
  const el=$('#meas');if(!el)return;
  if(!D2.meas.length){el.innerHTML='<p class="note">Use a ferramenta Medir e clique em dois pontos do desenho. Em DXF o programa encosta nos vértices próximos.</p>';return}
  el.innerHTML='<div class="scroll"><table><thead><tr><th>#</th><th class="num">Distância</th><th>Aplicar à carga</th><th></th></tr></thead><tbody>'+D2.meas.map((m,i)=>'<tr><td>'+(i+1)+'</td><td class="num">'+(m.m!=null?nf(m.m,3)+' m ('+nf(m.m*1000,0)+' mm)':nf(m.d,1)+' px')+'</td><td>'+(m.m!=null?'<div class="row"><select id="ms-'+i+'" style="width:auto"><option value="L">Comprimento</option><option value="W">Largura</option><option value="H">Altura</option></select><button class="btn sm" data-act="applyMeas" data-arg="'+i+'">Aplicar</button></div>':'<span class="note">calibre a escala</span>')+'</td><td><button class="btn sm" data-act="delMeas" data-arg="'+i+'">Remover</button></td></tr>').join('')+'</tbody></table></div>';
}
function bindCanvas(){
  const cvs=$c();let drag=null,ptrs=new Map(),pd=0;
  const pos=e=>{const r=cvs.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  const snap=(sx,sy)=>{D2.snapHit=null;let w=s2w(sx,sy);if(D2.kind!=='dxf')return w;let best=12*12,hit=null;
    for(const p of D2.polys){if(D2.hidden[p.layer])continue;const a=p.pts[0],b=p.pts[p.pts.length-1];for(const q of [a,b]){const s=w2s(q[0],q[1]),d=(s[0]-sx)**2+(s[1]-sy)**2;if(d<best){best=d;hit=q}}
      if(p.pts.length<=8)for(const q of p.pts){const s=w2s(q[0],q[1]),d=(s[0]-sx)**2+(s[1]-sy)**2;if(d<best){best=d;hit=q}}}
    if(hit){D2.snapHit=hit;return hit}return w};
  cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);const p=pos(e);ptrs.set(e.pointerId,p);pd=ptrs.size===2?Math.hypot(...[...ptrs.values()].reduce((a,b)=>[a[0]-b[0],a[1]-b[1]]),0):0;
    if(D2.tool==='pan'||ptrs.size===2)drag={x:p[0],y:p[1],moved:false};
    else{drag={x:p[0],y:p[1],moved:false,click:true}}});
  cvs.addEventListener('pointermove',e=>{const p=pos(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,p);
    if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd){zoomAt((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2,d/pd)}pd=d;return}
    if(drag&&D2.tool==='pan'&&ptrs.has(e.pointerId)){D2.view.x+=p[0]-drag.x;D2.view.y+=p[1]-drag.y;drag.x=p[0];drag.y=p[1];drag.moved=true;d2draw();return}
    if(drag&&drag.click&&Math.hypot(p[0]-drag.x,p[1]-drag.y)>5)drag.moved=true;
    if(D2.tool!=='pan'){D2.cur=snap(p[0],p[1]);d2draw()}});
  cvs.addEventListener('pointerup',e=>{const p=pos(e);ptrs.delete(e.pointerId);
    if(drag&&drag.click&&!drag.moved&&D2.tool!=='pan'){const w=snap(p[0],p[1]);D2.pts.push([w[0],w[1]]);
      if(D2.pts.length===2){const a=D2.pts[0],b=D2.pts[1],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
        if(D2.tool==='measure'){D2.meas.push({a,b,d,m:D2.kind==='dxf'?d*D2.mPerUnit:(D2.rasterCal?d*D2.mPerUnit:null)});D2.pts=[];drawMeasList()}
        else{D2.calPts=[a,b];$('#cal-form').hidden=false;$('#cal-form').innerHTML='<label class="f" style="flex-direction:row;align-items:center;gap:8px"><span>Distância real entre os pontos (mm)</span><input id="cal-mm" type="number" step="any" style="width:130px"></label><button class="btn primary sm" data-act="calApply">Calibrar</button>'}}
      d2draw()}
    drag=null;pd=0});
  cvs.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);zoomAt(p[0],p[1],Math.exp(-e.deltaY*0.0015))},{passive:false});
  new ResizeObserver(()=>d2draw()).observe(cvs);
}
function zoomAt(sx,sy,f){const w=s2w(sx,sy);D2.view.k=clamp(D2.view.k*f,1e-6,1e6);const s=w2s(w[0],w[1]);D2.view.x+=sx-s[0];D2.view.y+=sy-s[1];d2draw()}
const INSU={1:0.0254,2:0.3048,4:0.001,5:0.01,6:1,3:1609.344,14:0.1};
async function handleFile(file){
  const msg=$('#load-msg');const ext=(file.name.split('.').pop()||'').toLowerCase();msg.textContent='Lendo '+file.name+'…';
  try{
    if(ext==='dwg'){msg.textContent='Arquivos DWG não são lidos diretamente. No AutoCAD use Salvar como → DXF e carregue o DXF. Leitura direta de DWG está prevista para a versão local.';return}
    if(ext==='dxf'){
      const text=new TextDecoder('utf-8').decode(await file.arrayBuffer());
      if(typeof DxfParser==='undefined')throw new Error('leitor de DXF não carregou');
      const dxf=new DxfParser().parseSync(text);const fl=flattenDxf(dxf);
      Object.assign(D2,{kind:'dxf',polys:fl.polys,texts:fl.texts,raster:null,flip:true,meas:[],pts:[],name:file.name,hidden:{},rasterCal:false});
      const lay={};fl.polys.forEach(p=>lay[p.layer]=(lay[p.layer]||0)+1);D2.layers=lay;
      const iu=dxf.header&&dxf.header['$INSUNITS'];D2.mPerUnit=S.ui.d2unit==='auto'?(INSU[iu]||0.001):({mm:.001,cm:.01,m:1,in:.0254}[S.ui.d2unit]);
      showD2();msg.textContent='DXF carregado: '+fl.polys.length.toLocaleString('pt-BR')+' linhas, '+Object.keys(lay).length+' camadas. Confirme a unidade no seletor ao lado.';S.src=[...new Set([...S.src,file.name])];save();return}
    if(ext==='pdf'){
      if(typeof pdfjsLib==='undefined')throw new Error('leitor de PDF não carregou');
      try{const wsrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdfjsLib.GlobalWorkerOptions.workerPort=new Worker(URL.createObjectURL(new Blob(['importScripts("'+wsrc+'");'],{type:'text/javascript'})))}catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const page=await pdf.getPage(1);
      const v1=page.getViewport({scale:1}),sc=Math.min(2.5,5500/Math.max(v1.width,v1.height)),vp=page.getViewport({scale:sc});
      const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      Object.assign(D2,{kind:'raster',raster:c,polys:[],texts:[],flip:false,meas:[],pts:[],name:file.name+' (página 1 de '+pdf.numPages+')',mPerUnit:0,rasterCal:false});showD2();msg.textContent='PDF renderizado (página 1). Calibre a escala com uma cota conhecida antes de medir.';S.src=[...new Set([...S.src,file.name])];save();return}
    if(['png','jpg','jpeg'].includes(ext)){
      const img=await createImageBitmap(file);const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);
      Object.assign(D2,{kind:'raster',raster:c,polys:[],texts:[],flip:false,meas:[],pts:[],name:file.name,mPerUnit:0,rasterCal:false});showD2();msg.textContent='Imagem carregada. Calibre a escala antes de medir.';S.src=[...new Set([...S.src,file.name])];save();return}
    if(ext==='stl'){setModel(parseSTL(await file.arrayBuffer()),file.name);showM3();msg.textContent='STL carregado.';return}
    if(ext==='step'||ext==='stp'){
      msg.textContent='Convertendo STEP… (pode levar alguns segundos)';
      const occt=await loadOcct();const res=occt.ReadStepFile(new Uint8Array(await file.arrayBuffer()),null);if(!res.success)throw new Error('arquivo STEP não pôde ser lido');
      const arr=[];res.meshes.forEach(m=>{const p=m.attributes.position.array,ix=m.index.array;for(let i=0;i<ix.length;i++){arr.push(p[ix[i]*3],p[ix[i]*3+1],p[ix[i]*3+2])}});
      S.ui.munit='mm';setModel(new Float32Array(arr),file.name);showM3();msg.textContent='STEP convertido (assumido em milímetros).';return}
    msg.textContent='Formato não suportado: .'+ext;
  }catch(err){
    msg.innerHTML='<span style="color:var(--bad)">Não foi possível abrir: '+esc(err.message)+'.</span>'+((ext==='step'||ext==='stp')?' O conversor STEP é bloqueado neste visualizador. Abra este arquivo HTML diretamente no computador, ou exporte o modelo para STL (FreeCAD, Autodesk Viewer).':'');
  }
}
function showD2(){
  $('#d2-wrap').hidden=false;bindCanvasOnce();
  $('#d2-unit').innerHTML=D2.kind==='dxf'?'<label class="f" style="flex-direction:row;align-items:center;gap:6px"><span>Unidade</span><select id="d2u" style="width:auto"><option value="auto">Automática</option><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">polegada</option></select></label>':'';
  const u=$('#d2u');if(u){u.value=S.ui.d2unit;u.onchange=()=>{S.ui.d2unit=u.value;if(u.value!=='auto')D2.mPerUnit={mm:.001,cm:.01,m:1,in:.0254}[u.value];D2.meas.forEach(m=>m.m=Math.hypot(m.a[0]-m.b[0],m.a[1]-m.b[1])*D2.mPerUnit);save();d2info();drawMeasList();d2draw()}}

  $$('[data-layer]').forEach(cb=>cb.onchange=()=>{D2.hidden[cb.dataset.layer]=!cb.checked;d2draw()});

}
let canvasBound=null;function bindCanvasOnce(){const c=$c();if(canvasBound!==c){bindCanvas();canvasBound=c}}
function showM3(){
  $('#m3-wrap').hidden=false;
  if(!modelStage){modelStage=new Stage($('#m3'))}

}
function refreshM3(){
  if(!modelStage||!modelStage.ok||!modelGeo)return;const s=modelStage;s.clear();s.scene.background=new THREE.Color(cv('--canvas'));
  s.scene.add(new THREE.AmbientLight(0xffffff,0.8));const dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(5,10,7);s.scene.add(dl);
  s.scene.add(M3.mesh(modelGeo,cv('--accent')));const d=MODEL.st.dims;s.scene.add(new THREE.GridHelper(Math.max(d.L,d.W,d.H)*2.5,20,cv('--muted'),cv('--grid')));
  s.fit(new THREE.Box3(new THREE.Vector3(-d.L/2,0,-d.W/2),new THREE.Vector3(d.L/2,d.H,d.W/2)));$('#m3-stats').innerHTML=modelStats();
}
MOUNT.modelo=function(){
  const drop=$('#drop'),fi=$('#f-draw');
  fi.onchange=()=>{if(fi.files[0])handleFile(fi.files[0])};
  ['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));

/* ============================== início ============================== */
const h=(location.hash||'').slice(1);if(VIEWS[h])tab=h;
render();
})();
